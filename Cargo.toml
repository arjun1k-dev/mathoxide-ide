[workspace]
resolver = "2"
members = [
    "crates/mo-core",
    "crates/mo-render",
    "crates/mo-dsl",
    "crates/mo-moab",
    "crates/mo-interactive",
    "crates/mo-ide",
    "crates/mo-mcp",
    "crates/mo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Arjun"]

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "24"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
notify = "7"
image = "0.25"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui-wgpu = "0.31"
epaint_default_fonts = "0.31"
ttf-parser = "0.25"
ndarray = "0.17"
num-traits = "0.2"
num-complex = "0.4"
approx = "0.5"
nalgebra = "0.35"
rustfft = "6.4"
statrs = "0.19"
svgtypes = "0.16"
roxmltree = "0.21"
rfd = "0.15"
serde_json = "1"

mo-core = { path = "crates/mo-core" }
mo-render = { path = "crates/mo-render" }
mo-dsl = { path = "crates/mo-dsl" }
mo-moab = { path = "crates/mo-moab" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
